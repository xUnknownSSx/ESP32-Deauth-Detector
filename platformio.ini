; --- UNIVERSAL FILE SETTINGS SHAREABLE ACROSS BOTH ENVS ---
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.2

; --- TARGET 1: THE STANDARD 38-PIN DEV KIT ---
[env:esp32dev]
platform = espressif32
board = esp32dev
src_filter = +<main_devkit.cpp> -<main_xiao_c6.cpp>

; --- TARGET 2: THE SEEED STUDIO XIAO ESP32-C6 ---
[env:seeed_xiao_esp32c6]
; Pulls the manufacturer-verified platform mapping variables cleanly
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
src_filter = +<main_xiao_c6.cpp> -<main_devkit.cpp>
